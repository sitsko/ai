services:
  ai-sandbox-kilo:
    build:
      context: .
      dockerfile: ai-sandbox-kilo.dockerfile
    image: ai-sandbox-kilo:latest
    container_name: ai-sandbox-kilo
    hostname: sandbox-kilo
    stdin_open: true
    tty: true
    working_dir: /workspace
    # Debug ports reachable from the host
    ports:
      - "5005:5005"   # JDWP (Quarkus dev debug: ./mvnw quarkus:dev)
      - "9229:9229"   # Node --inspect
      - "8080:8080"   # default Quarkus/Node app port
    volumes:
      - ${PROJECT_DIR}:/workspace
      # Persist Maven local repo across container rebuilds/recreations
      - maven-repo:/home/developer/.m2
      # Persist npm global installs (kilocode, claude-code) and npm cache
      - npm-global:/home/developer/.npm-global
      # Persist agent state/history so multiple containers share identity
      - kilo-data:/home/developer/.kilocode
      - claude-data:/home/developer/.claude
    environment:
      MAVEN_OPTS: "-Dmaven.repo.local=/home/developer/.m2/repository"
    networks:
      - sandbox-net
    # Uncomment if the sandbox needs to reach a host service (e.g. local LDAP/Kafka)
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

networks:
  sandbox-net:
    driver: bridge

volumes:
  maven-repo:
  npm-global:
  kilo-data:
  claude-data:
